# Memoria para el demonio de Gradle. Si tu equipo tiene poca RAM baja el -Xmx a 1536m.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Compila los modulos en paralelo y reutiliza resultados de builds anteriores.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true

# Solo genera los recursos de las clases R que el modulo realmente usa.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
